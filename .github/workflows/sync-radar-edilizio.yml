name: Sync Radar Edilizio into Territory System
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-radar-edilizio.yml']
  schedule:
    - cron: '20 6,12,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica feed Radar Edilizio
        run: |
          mkdir -p data
          curl -fsSL --retry 3 "https://josephsocialmedia2-spec.github.io/launcher-dashboard/data/radar_edilizio.json?ts=$(date +%s)" -o data/radar_edilizio.json
          python -m json.tool data/radar_edilizio.json >/dev/null
      - name: Sanifica feed prima del Giro
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          path = Path('data/radar_edilizio.json')
          db = json.loads(path.read_text(encoding='utf-8'))

          core_re = re.compile(
              r'\b(?:pdc|scia|cila|scagi)\b|permesso di costruire|pratica edilizia|'
              r'edilizia privata|agibilit[aà]|cambio di destinazione|accertamento conformit[aà]|'
              r'autorizzazione paesaggistica|sanatoria edilizia',
              re.I,
          )
          noise_re = re.compile(
              r'documento[_ ]pec|deposito atti|avviso deposito|notifica atti|s\.?o\.?g\.?e\.?t|'
              r'riscossione|d\.?p\.?r\.?\s*600/1973|assistenza legale|stragiudiziale|'
              r'fornitura di stabilizzato|manutenzione straordinaria della strada',
              re.I,
          )

          def canonical(url):
              if not url:
                  return ''
              p = urlsplit(url)
              q = parse_qsl(p.query, keep_blank_values=True)
              if 'dettagliofile.aspx' in p.path.lower():
                  q = [(k, v) for k, v in q if k.lower() != 'd']
              q.sort(key=lambda kv: (kv[0].lower(), kv[1]))
              return urlunsplit((p.scheme.lower(), p.netloc.lower(), p.path, urlencode(q, doseq=True), ''))

          clean = []
          seen = set()
          removed = 0
          for row in db.get('opportunities', []):
              text = ' '.join(str(row.get(k, '')) for k in ('atto', 'tipo', 'descrizione'))
              if noise_re.search(text) and not core_re.search(text):
                  removed += 1
                  continue
              url = canonical(row.get('source_url', ''))
              if url:
                  if url in seen:
                      removed += 1
                      continue
                  seen.add(url)
                  row['source_url'] = url
              clean.append(row)

          db['opportunities'] = clean
          db.setdefault('meta', {})['territory_sync_pruned_records'] = removed
          path.write_text(json.dumps(db, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'SANITIZE removed={removed} opportunities={len(clean)}')
          PY
          python -m json.tool data/radar_edilizio.json >/dev/null
      - name: Aggiorna repository territoriale
        run: |
          git config user.name "f1-territory-sync"
          git config user.email "f1-territory-sync@users.noreply.github.com"
          git add data/radar_edilizio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync Radar Edilizio territory feed"
          git push
