name: Publish F1 Territory Acquisition System
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-gh-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aggiorna gh-pages
        run: |
          git config user.name "f1-territory-pages"
          git config user.email "f1-territory-pages@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
